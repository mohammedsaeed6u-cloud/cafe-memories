<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" fill="none">
  <!-- Drop shadow block -->
  <rect x="4" y="4" width="50" height="50" rx="12" fill="#1C1917" />

  <!-- Main Stamp Surface in Forest Green -->
  <rect x="1" y="1" width="50" height="50" rx="12" fill="#17382B" stroke="#1C1917" stroke-width="2.2" />

  <!-- Perforated edges cutouts (stamp teeth) -->
  <circle cx="1" cy="18" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />
  <circle cx="1" cy="34" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />
  <circle cx="51" cy="18" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />
  <circle cx="51" cy="34" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />
  <circle cx="18" cy="1" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />
  <circle cx="34" cy="1" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />
  <circle cx="18" cy="51" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />
  <circle cx="34" cy="51" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />

  <!-- Inner Delicate Gold Dashed Seal -->
  <rect x="7" y="7" width="38" height="38" rx="8" stroke="#F5C842" stroke-width="1.4" stroke-dasharray="3 2" />

  <!-- Crimson Center Wax Seal / Star Stamp -->
  <circle cx="26" cy="26" r="11" fill="#C83B4B" stroke="#1C1917" stroke-width="1.2" />
  <path d="M 26 19 L 27.5 24 L 32.5 25.5 L 27.5 27 L 26 32 L 24.5 27 L 19.5 25.5 L 24.5 24 Z" fill="#FFFFFF" />
  <circle cx="26" cy="26" r="1.8" fill="#F5C842" />

  <!-- Corner Brass Pin -->
  <circle cx="43" cy="9" r="2" fill="#F5C842" stroke="#1C1917" stroke-width="0.8" />
</svg>
