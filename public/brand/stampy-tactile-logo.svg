<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" width="250" height="64" fill="none">
  <!-- Perforated Postage Stamp Icon -->
  <g transform="translate(6, 4)">
    <!-- Drop shadow block -->
    <rect x="3" y="3" width="50" height="50" rx="12" fill="#1C1917" />

    <!-- Main Stamp Surface in Forest Green -->
    <rect x="0" y="0" width="50" height="50" rx="12" fill="#17382B" stroke="#1C1917" stroke-width="2.2" />

    <!-- Perforated edges cutouts (stamp teeth) -->
    <circle cx="0" cy="17" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />
    <circle cx="0" cy="33" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />
    <circle cx="50" cy="17" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />
    <circle cx="50" cy="33" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />
    <circle cx="17" cy="0" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />
    <circle cx="33" cy="0" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />
    <circle cx="17" cy="50" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />
    <circle cx="33" cy="50" r="3.2" fill="#FAF7F2" stroke="#1C1917" stroke-width="1.2" />

    <!-- Inner Delicate Gold Dashed Seal -->
    <rect x="6" y="6" width="38" height="38" rx="8" stroke="#F5C842" stroke-width="1.4" stroke-dasharray="3 2" />

    <!-- Crimson Center Wax Seal / Star Stamp -->
    <circle cx="25" cy="25" r="11" fill="#C83B4B" stroke="#1C1917" stroke-width="1.2" />
    <path d="M 25 18 L 26.5 23 L 31.5 24.5 L 26.5 26 L 25 31 L 23.5 26 L 18.5 24.5 L 23.5 23 Z" fill="#FFFFFF" />
    <circle cx="25" cy="25" r="1.8" fill="#F5C842" />

    <!-- Corner Brass Pin -->
    <circle cx="42" cy="8" r="2" fill="#F5C842" stroke="#1C1917" stroke-width="0.8" />
  </g>

  <!-- Typography -->
  <text x="70" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', system-ui, sans-serif" font-size="30" font-weight="900" letter-spacing="-0.03em" fill="#1C1917">Stampy</text>
  <text x="70" y="52" font-family="'Tajawal', sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.06em" fill="#C83B4B">استوديو الذكريات والولاء</text>

  <!-- Crimson Stamp Pill Badge -->
  <g transform="translate(182, 16)">
    <rect width="60" height="22" rx="11" fill="#C83B4B" stroke="#1C1917" stroke-width="1.5" />
    <text x="30" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" letter-spacing="0.08em" text-anchor="middle" fill="#FFFFFF">ATELIER</text>
  </g>
</svg>
