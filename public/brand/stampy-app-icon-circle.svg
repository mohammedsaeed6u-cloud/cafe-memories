<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="app-icon-clip">
      <circle cx="512" cy="512" r="512" />
    </clipPath>
  </defs>

  <g clip-path="url(#app-icon-clip)">
    <!-- Background: Solid Warm Gold Ochre (#DFAB56) -->
    <rect width="1024" height="1024" fill="#DFAB56" />

    <!-- 5 Spectral Emulsion Stripes -->

    <rect x="0" y="392" width="1024" height="48" fill="#3D2314" />

    <rect x="0" y="440" width="1024" height="48" fill="#AC3E25" />

    <rect x="0" y="488" width="1024" height="48" fill="#EBA935" />

    <rect x="0" y="536" width="1024" height="48" fill="#B18944" />

    <rect x="0" y="584" width="1024" height="48" fill="#337482" />


    <!-- Aperture Backing Mask (Prevents stripes from showing inside lens) -->
    <circle cx="512" cy="512" r="196" fill="#DFAB56" />
    <circle cx="512" cy="512" r="196" fill="none" stroke="#3D2314" stroke-width="10" />

    <!-- 6-Blade Camera Iris Aperture Shutter -->
    <g transform="translate(512, 512) scale(5.294117647058823) translate(-350, -230)">
      <path d="M 359.96 235.75 L 359.96 262.51 A 34 34 0 0 1 326.83 254.88 L 350.00 241.50 Z" fill="#3D2314" stroke="#DFAB56" stroke-width="1.2" stroke-linejoin="round" />
      <path d="M 350.00 241.50 L 326.83 254.88 A 34 34 0 0 1 316.87 222.37 L 340.04 235.75 Z" fill="#3D2314" stroke="#DFAB56" stroke-width="1.2" stroke-linejoin="round" />
