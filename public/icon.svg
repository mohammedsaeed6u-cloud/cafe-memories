<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#DD0200" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#55100D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#141313" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1D1D"/>
      <stop offset="100%" stop-color="#141212"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#DD0200" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBF9F5"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4A"/>
      <stop offset="100%" stop-color="#DD0200"/>
    </linearGradient>
  </defs>

  <!-- Base Obsidian Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="116" fill="url(#ambientGlow)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Memories Iconic Architectural Arch -->
  <g transform="translate(106, 86) scale(3.0)">
    <!-- Outer Arch Frame -->
    <path
      d="M14 102V46C14 26.1177 30.1177 10 50 10C69.8823 10 86 26.1177 86 46V102H14Z"
      stroke="url(#archGrad)"
      stroke-width="7"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Radiant Crimson Sun Disc -->
    <circle cx="63" cy="38" r="10" fill="url(#sunGrad)"/>

    <!-- Dunes & Horizon Silhouette -->
    <path
      d="M17 100C17 90 26 80 39 80C50 80 57 91 67 91C75 91 80 84 83 78V100H17Z"
      fill="#FBF9F5"
    />

    <!-- Ambient Pebble Accent -->
    <circle cx="65" cy="95" r="2.5" fill="#DD0200"/>
  </g>
</svg>