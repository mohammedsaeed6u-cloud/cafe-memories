<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="#5B2D9E" />
  
  <!-- Outer Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.15" />
  
  <!-- Stamp Notch Cutouts (Apple Wallet Pass Feel) -->
  <path d="M 0 216 A 40 40 0 0 1 0 296 Z" fill="#F7F4FC" />
  <path d="M 512 216 A 40 40 0 0 0 512 296 Z" fill="#F7F4FC" />
  
  <!-- Sculpted S Monogram -->
  <path d="M 350 180 C 320 145 285 140 245 140 C 185 140 160 175 160 215 C 160 285 350 255 350 330 C 350 385 305 405 250 405 C 190 405 155 378 145 342" 
        stroke="#FFFFFF" 
        stroke-width="42" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Signature Coral Sparkle Star (APNs / Reward Spark) -->
  <path d="M 415 65 L 430 115 L 475 130 L 430 145 L 415 195 L 400 145 L 355 130 L 400 115 Z" 
        fill="#F0456A" 
        stroke="#1A0A33" 
        stroke-width="8" />
        
